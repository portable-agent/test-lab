name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
        with:
          version: 3.53.1
      - name: Проверить конфигурацию
        run: task verify
      - name: Запустить k6 smoke
        run: task test:smoke
  security:
    uses: portable-agent/.github/.github/workflows/reusable-security.yml@main

