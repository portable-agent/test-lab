name: Weekly load
on:
  workflow_dispatch:
  schedule:
    - cron: "40 3 * * 1"
permissions:
  contents: read
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
        with:
          version: 3.53.1
      - name: Запустить расширенный локальный тест
        env:
          K6_USERS: "20"
          K6_TIME: 2m
        run: task test:smoke

