server {
    listen 8080;
    server_name _;
    location = /health {
        default_type application/json;
        return 200 '{"status":"UP"}';
    }
    location = /api/test {
        default_type application/json;
        add_header X-Test-Lab true;
        return 200 '{"result":"ok"}';
    }
    location / {
        default_type application/json;
        return 404 '{"error":"not_found"}';
    }
}

